<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open Sports Analysis</title>
  <script>
    // Apply stored theme before first paint to avoid a flash of light mode.
    (function () {
      var t = localStorage.getItem('theme');
      if (t !== 'dark' && t !== 'light')
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    body { background: var(--bs-body-bg); }
    #map { height: 420px; border: 1px solid var(--bs-border-color); border-radius: .375rem; }
    #elevation-chart, #graphs-chart { height: 320px; }
    .activity-item { cursor: pointer; }
    .category-badge { font-size: .75rem; min-width: 4.5rem; }
    .stat-value { font-size: 1.25rem; font-weight: 600; }
    .stat-label { font-size: .7rem; text-transform: uppercase; color: var(--bs-secondary-color); }
    .sidebar-sticky { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; }
    .mini-map { background: var(--bs-tertiary-bg); }
    .activity-section .card-header { cursor: pointer; }
    #climbs-head-row th[data-sort] { cursor: pointer; user-select: none; white-space: nowrap; }
    #climbs-head-row th[data-sort]:hover { color: var(--bs-primary); }
    #climbs-head-row th.sort-active { color: var(--bs-primary); text-decoration: underline; }
    #climbs-head-row .sort-arrow { font-size: .8em; }
    .activity-section .card-header .chevron::before { content: '▼'; }
    .activity-section .card-header.collapsed .chevron::before { content: '▶'; }
    #sidebar .list-group .chevron { transition: transform .2s; }
    #sidebar a[aria-expanded="true"] .chevron { transform: rotate(90deg); }
    [data-bs-theme="dark"] .mini-map { filter: brightness(0.8) saturate(0.8); }
  </style>
</head>
<body>
  <div id="nav"></div>

  <div class="container-fluid py-3">
    <div id="loading" class="d-none text-center py-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
      <p class="text-muted mt-2 small">Loading…</p>
    </div>

    <div class="row g-3">
      <aside id="sidebar" class="col-lg-2 col-md-3 d-none d-md-block"></aside>
      <main id="app" class="col-lg-10 col-md-9"></main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
  <script src="https://unpkg.com/@protomaps/basemaps@5.7.2/dist/basemaps.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.2/leaflet-maplibre-gl.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
